plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atmoxr.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.atmoxr.app'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '4.2'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// O app é um wrapper leve: nenhuma dependência externa (só o framework Android).
dependencies {
}
