plugins {
    id 'com.android.application'
}

def atmoxrKeystorePath = System.getenv('ATMOXR_SIGNING_KEYSTORE')
def atmoxrSigningPassword = System.getenv('ATMOXR_SIGNING_PASSWORD')
def hasAtmoxrSigning = atmoxrKeystorePath && atmoxrSigningPassword

android {
    namespace 'com.atmoxr.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.atmoxr.app'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '4.3'
    }

    signingConfigs {
        if (hasAtmoxrSigning) {
            atmoxr {
                storeFile file(atmoxrKeystorePath)
                storePassword atmoxrSigningPassword
                keyAlias 'atmoxr'
                keyPassword atmoxrSigningPassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (hasAtmoxrSigning) signingConfig signingConfigs.atmoxr
        }
        release {
            minifyEnabled false
            if (hasAtmoxrSigning) signingConfig signingConfigs.atmoxr
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// O app é um wrapper leve: nenhuma dependência externa (só o framework Android).
dependencies {
}
