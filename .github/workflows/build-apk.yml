name: Build APK (PotatoVR)

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (API 34)
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Copy optimized web game into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          ls -lh app/src/main/assets/

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare PotatoVR.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PotatoVR.apk
          ls -lh PotatoVR.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotatoVR-apk
          path: PotatoVR.apk
          if-no-files-found: error

      - name: Publish APK to Release (link direto permanente)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "PotatoVR — APK mais recente"
          body: |
            APK do **PotatoVR** gerado automaticamente a partir do `index.html` otimizado.

            📲 Baixe o arquivo **PotatoVR.apk** abaixo e instale no Android
            (pode ser necessário permitir "instalar de fontes desconhecidas").

            Requer: Android 8+, câmera traseira, giroscópio e internet no primeiro uso
            (as bibliotecas Three.js/MediaPipe são carregadas de CDN).
          files: PotatoVR.apk
          fail_on_unmatched_files: true
          make_latest: true
